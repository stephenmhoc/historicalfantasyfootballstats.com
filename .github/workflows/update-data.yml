name: Update data

on:
  schedule:
    - cron: '17 10 * * *' # After West Coast games end and nflverse has published
  workflow_dispatch:
    inputs:
      season:
        description: Season to refresh (defaults to the current one)
        required: false

concurrency:
  group: update-data
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      # The DSN's public key, which only allows sending check-ins.
      SENTRY_MONITOR_URL: https://o4510771621789696.ingest.us.sentry.io/api/4512358195986432/cron/update-data/58692f0ccd6e2745819d4b41d340e1b3/

    steps:
      # Sentry raises an issue if this job fails or stops running. The margin is wide
      # because GitHub often starts scheduled workflows late.
      - name: Report start to Sentry
        continue-on-error: true
        run: |
          curl -fsS -X POST "$SENTRY_MONITOR_URL" -H 'Content-Type: application/json' -d '{
            "status": "in_progress",
            "monitor_config": {
              "schedule": { "type": "crontab", "value": "17 10 * * *" },
              "timezone": "UTC",
              "checkin_margin": 180,
              "max_runtime": 30
            }
          }'

      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Fetch latest stats
        env:
          SEASON: ${{ inputs.season }}
        run: node scripts/updateData.js ${SEASON:+--season "$SEASON"}

      - name: Check for changes
        id: changes
        run: |
          git add public/data src/generated
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Run unit tests
        if: steps.changes.outputs.changed == 'true'
        run: npm test -- --run

      - name: Build
        if: steps.changes.outputs.changed == 'true'
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: npm run build

      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Update fantasy data'
          git push

      # A push made with GITHUB_TOKEN does not trigger deploy.yml, so deploy from here.
      - name: Deploy
        if: steps.changes.outputs.changed == 'true'
        env:
          CF_SEND_TELEMETRY: 'false'
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx cf deploy --prebuilt --message 'Update fantasy data'

      # GitHub disables scheduled workflows after 60 days without repository activity,
      # which would otherwise happen every offseason.
      - name: Keep schedule enabled
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/$GITHUB_REPOSITORY/actions/workflows/update-data.yml/enable"

      - name: Report result to Sentry
        if: always()
        continue-on-error: true
        env:
          STATUS: ${{ job.status == 'success' && 'ok' || 'error' }}
        run: curl -fsS "$SENTRY_MONITOR_URL?status=$STATUS"
